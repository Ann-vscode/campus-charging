obstacles:
  static:
    - { id: OB1, type: flowerbed, x: 40,  y: 10, radius_m: 2.0 }
    - { id: OB2, type: building,  x: 100, y: 12, radius_m: 3.0 }
    - { id: OB3, type: lamp_post, x: 105, y: 30, radius_m: 0.5 }
  # 可由 POST /api/demo/obstacle 动态添加的临时路障位，默认 inactive。
  dynamic_slots:
    - { id: TMP1, x: 45,  y: 22, active: false }
    - { id: TMP2, x: 100, y: 22, active: false }
    - { id: TMP3, x: 75,  y: 30, active: false }

charging:
  channels: 5
  channel_ids: [CH1, CH2, CH3, CH4, CH5]
  power_kw: 3.5
  transfer_loss: 0.05

scheduler:
  max_per_batch: 5
  weights:
    low_soc: 0.35
    avg_soc: 0.20
    distance: 0.25
    robot_energy: 0.20
  target_soc: 80
  refill_rule: nearest_zone_if_short

simulation:
  clock_source: backend
  speed_options: [1, 10, 60]
  time_format: ISO8601_UTC
